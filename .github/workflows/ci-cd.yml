name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - my-feature-branch  # Add your feature branch here
  pull_request:
    branches:
      - main
      - my-feature-branch  # Add your feature branch here

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # Updated to latest version

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push frontend
      uses: docker/build-push-action@v3
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/video-frontend:latest

    - name: Build and push user-service
      uses: docker/build-push-action@v3
      with:
        context: ./user-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/video-user-service:latest

    - name: Build and push upload-service
      uses: docker/build-push-action@v3
      with:
        context: ./upload-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/video-upload-service:latest

    - name: Build and push streaming-service
      uses: docker/build-push-action@v3
      with:
        context: ./streaming-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/video-streaming-service:latest

    - name: Build and push watchlist-service
      uses: docker/build-push-action@v3
      with:
        context: ./watchlist-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/video-watchlist-service:latest

    - name: Build and push recommendation-service
      uses: docker/build-push-action@v3
      with:
        context: ./recommendation-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/video-recommendation-service:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          git pull origin main  # Pull latest changes
          docker-compose down   # Stop existing containers
          docker-compose pull   # Pull updated images from Docker Hub
          docker-compose up -d  # Restart containers in detached mode
